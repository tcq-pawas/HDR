<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-size: 12px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 15px;
            background-color: #fff;
            min-height: 100vh;
        }
        .header {
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header h1 {
            color: #667eea;
            margin: 0;
            font-size: 18px;
        }
        .content {
            line-height: 1.5;
            font-size: 12px;
        }
        .content h1 {
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
            margin-top: 20px;
            font-size: 16px;
        }
        .content h2 {
            color: #764ba2;
            margin-top: 15px;
            font-size: 14px;
        }
        .content h3 {
            color: #555;
            margin-top: 12px;
            font-size: 13px;
        }
        .content pre {
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            border-left: 3px solid #667eea;
            font-size: 11px;
        }
        .content code {
            background-color: #f4f4f4;
            padding: 1px 4px;
            border-radius: 2px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }
        .content pre code {
            background-color: transparent;
            padding: 0;
        }
        .content ul {
            padding-left: 15px;
        }
        .content li {
            margin-bottom: 5px;
        }
        .content strong {
            color: #667eea;
        }
        .content p {
            margin-bottom: 10px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 10px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard/" class="back-link">← Back to Dashboard</a>
        <div class="header">
            <h1>{{ title }}</h1>
        </div>
        <div class="content">
            {{ content|safe }}
        </div>
    </div>
</body>
</html>
