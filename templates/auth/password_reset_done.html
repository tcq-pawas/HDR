<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent - HeyDay Realty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <style>
        :root {
            --primary: #004526;
            --secondary: #006638;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, rgba(15, 118, 110, 0.3) 20%, rgba(17, 94, 89, 0.3) 60%, rgba(6, 78, 59, 0.3) 100%),
                        url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
        }

        .success-card {
            background: white;
            border-radius: 24px;
            padding: 3rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .icon-circle i {
            font-size: 2rem;
            color: white;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            border-radius: 12px;
            padding: 0.875rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: #115E59;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(15, 118, 110, 0.5);
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="icon-circle">
            <i class="fas fa-envelope-open-text"></i>
        </div>
        <h2>Check Your Email</h2>
        <p>We've emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.</p>
        <p class="small text-muted mb-4">If you don't receive an email, please make sure you've entered the address you registered with, and check your spam folder.</p>
        <a href="{% url 'auth:login' %}" class="btn btn-primary">Return to Login</a>
    </div>
</body>
</html>
