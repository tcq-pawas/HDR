name: Deploy to Production

on:
  push:
    branches:
      - Production
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Django App to Production
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # Step 1: Checkout Repository
      # ============================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # Step 2: Configure SSH
      # ============================================
      - name: Configure SSH
        env:
          PROD_EC2_SSH_KEY: ${{ secrets.PROD_EC2_SSH_KEY }}
          PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
        run: |
          set -euo pipefail

          if [ -z "${PROD_EC2_HOST:-}" ]; then
            echo "::error::PROD_EC2_HOST secret is empty"
            exit 1
          fi

          if [ -z "${PROD_EC2_SSH_KEY:-}" ]; then
            echo "::error::PROD_EC2_SSH_KEY secret is empty"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$PROD_EC2_SSH_KEY" \
            | sed 's/\r$//' \
            | sed 's/\\n/\n/g' > ~/.ssh/ec2_key.pem

          chmod 600 ~/.ssh/ec2_key.pem

          if ! grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/ec2_key.pem; then
            echo "::error::Invalid private key format"
            exit 1
          fi

          ssh-keyscan -H -T 10 "$PROD_EC2_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/ec2_key.pem > /dev/null

          echo "SSH configured successfully"

      # ============================================
      # Step 3: Deploy to Production EC2
      # ============================================
      - name: Deploy Application
        env:
          PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          PROD_EC2_USER: ${{ secrets.PROD_EC2_USER }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/ec2_key.pem \
            -o StrictHostKeyChecking=yes \
            "${PROD_EC2_USER}@${PROD_EC2_HOST}" \
            'bash -s' << 'ENDSSH'

          set -Eeuo pipefail

          PROJECT_DIR="/home/ubuntu/HDR"
          BRANCH="Production"
          COMPOSE_FILE="docker-compose.prod.yml"
          DEPLOYMENT_URL="https://hhectare.com"

          cd "$PROJECT_DIR"

          echo "============================================"
          echo "Starting production deployment"
          echo "============================================"

          # Validate production Compose file
          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "ERROR: $COMPOSE_FILE not found in $PROJECT_DIR"
            exit 1
          fi

          # Use the production Compose file for every operation
          dc() {
            docker compose -f "$COMPOSE_FILE" "$@"
          }

          # ============================================
          # Step 1: Pull latest production code
          # ============================================
          echo "::group::Pulling latest code"

          # Configure Git authentication without printing the token
          git config --global \
            url."https://${GIT_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

          git fetch origin "$BRANCH"

          git reset --hard "origin/$BRANCH"

          # Remove untracked files, preserving ignored files
          git clean -fd

          echo "Current commit: $(git rev-parse --short HEAD)"

          echo "::endgroup::"

          # Validate Compose configuration
          echo "::group::Validating production configuration"

          dc config --quiet

          echo "Production Compose configuration is valid"

          echo "::endgroup::"

          # ============================================
          # Step 2: Build production images
          # ============================================
          echo "::group::Building production images"

          DOCKER_BUILDKIT=1 dc build --pull

          echo "Production images built successfully"

          echo "::endgroup::"

          # ============================================
          # Step 3: Start production containers
          # ============================================
          echo "::group::Starting production containers"

          dc up -d --force-recreate --remove-orphans

          echo "Containers started"

          echo "::endgroup::"

          # ============================================
          # Step 4: Wait for application startup
          # ============================================
          echo "::group::Waiting for application startup"

          sleep 25

          echo "::endgroup::"

          # ============================================
          # Step 5: Container status
          # ============================================
          echo "::group::Container status"

          dc ps

          echo "::endgroup::"

          # ============================================
          # Step 6: PostgreSQL health check
          # ============================================
          echo "::group::PostgreSQL health check"

          if dc exec -T postgres pg_isready -U postgres; then
            echo "PostgreSQL is healthy"
          else
            echo "ERROR: PostgreSQL health check failed"
            dc logs --tail=50 postgres
            exit 1
          fi

          echo "::endgroup::"

          # ============================================
          # Step 7: Django/Gunicorn health check
          # ============================================
          echo "::group::Django/Gunicorn health check"

          if dc exec -T web sh -c 'pgrep -f "[g]unicorn"'; then
            echo "Gunicorn is running"
          else
            echo "ERROR: Gunicorn is not running"
            dc logs --tail=50 web
            exit 1
          fi

          echo "::endgroup::"

          # ============================================
          # Step 8: Nginx health check
          # ============================================
          echo "::group::Nginx health check"

          if dc exec -T nginx nginx -t; then
            echo "Nginx configuration is valid"
          else
            echo "ERROR: Nginx configuration validation failed"
            dc logs --tail=50 nginx
            exit 1
          fi

          if dc exec -T nginx sh -c 'pgrep -f "[n]ginx: master process"'; then
            echo "Nginx is running"
          else
            echo "ERROR: Nginx is not running"
            dc logs --tail=50 nginx
            exit 1
          fi

          echo "::endgroup::"

          # ============================================
          # Step 9: HTTP/HTTPS health check
          # ============================================
          echo "::group::Application health check"

          if curl --fail --silent --show-error \
            --location \
            --max-time 30 \
            "$DEPLOYMENT_URL/" \
            --output /dev/null; then
            echo "Application responded successfully"
          else
            echo "ERROR: Application HTTP health check failed"
            dc logs --tail=50 nginx web
            exit 1
          fi

          echo "::endgroup::"

          # ============================================
          # Step 10: Deployment summary
          # ============================================
          echo "============================================"
          echo "PRODUCTION DEPLOYMENT COMPLETED"
          echo "============================================"
          echo "Branch: $BRANCH"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Compose file: $COMPOSE_FILE"
          echo "URL: $DEPLOYMENT_URL"
          echo "============================================"

          ENDSSH

      # ============================================
      # Step 4: Cleanup SSH Key
      # ============================================
      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem
