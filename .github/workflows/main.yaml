name: Deploy to EC2

on:
  push:
    branches:
      - HDR-New
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy Django App to EC2
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # Step 1: Checkout the code from GitHub
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4
      
      # ============================================
      # Step 2: Set up Python environment
      # ============================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # ============================================
      # Step 3: Install dependencies
      # ============================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # ============================================
      # Step 4: Run basic checks/tests
      # ============================================
      - name: Run Django checks
        run: |
          python manage.py check --deploy
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_ENGINE: django.db.backends.sqlite3
          DEBUG: False
      
      # ============================================
      # Step 5: Configure SSH key for EC2 access
      # ============================================
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      
      # ============================================
      # Step 6: Deploy to EC2 server
      # ============================================
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            # Set project directory
            PROJECT_DIR="/home/ubuntu/HeyDay"
            
            # Create project directory if it doesn't exist
            sudo mkdir -p $PROJECT_DIR
            sudo chown $USER:$USER $PROJECT_DIR
            
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo usermod -aG docker $USER
              sudo systemctl start docker
              sudo systemctl enable docker
            fi
            
            # Install Docker Compose plugin if not present
            if ! docker compose version &> /dev/null; then
              sudo apt-get install -y docker-compose-plugin
            fi
            
            # Clone repository if it doesn't exist, otherwise pull latest
            cd $PROJECT_DIR
            if [ ! -d "HDR" ] || [ ! -d "HDR/.git" ]; then
              # Remove existing HDR directory if it exists but is not a git repo
              if [ -d "HDR" ]; then
                rm -rf HDR
              fi
              git clone ${{ secrets.GITHUB_REPO_URL }} HDR
              cd HDR
              git checkout main
            else
              cd HDR
              git fetch origin main
              git checkout main
              git pull origin main
            fi
            
            # Create .env file from secrets if it doesn't exist
            if [ ! -f .env ]; then
              echo "SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" > .env
              echo "DEBUG=False" >> .env
              echo "DB_ENGINE=django.db.backends.postgresql" >> .env
              echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
              echo "DB_USER=${{ secrets.DB_USER }}" >> .env
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
              echo "DB_HOST=postgres" >> .env
              echo "DB_PORT=5432" >> .env
            fi
            
            # Stop existing containers
            docker compose down || true
            
            # Build and start containers
            docker compose build
            docker compose up -d
            
            # Wait for services to be healthy
            sleep 10
            
            # Show running containers
            docker compose ps
          ENDSSH
      
      # ============================================
      # Step 7: Cleanup SSH key
      # ============================================
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key.pem
