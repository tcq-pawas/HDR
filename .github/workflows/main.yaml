name: Deploy to EC2

on:
  push:
    branches:
      - Production
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Django App to EC2
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # Step 1: Checkout Repository
      # ============================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # Step 2: Configure SSH
      # ============================================
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ============================================
      # Step 3: Deploy to EC2
      # ============================================
      - name: Deploy Application
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'

          set -e

          PROJECT_DIR="/home/ubuntu/HDR"
          BRANCH="Production"
          DEPLOYMENT_URL="https://x-realtors.in"

          cd "$PROJECT_DIR"

          echo "🚀 Starting deployment to EC2..."
          echo ""

          # Git operations
          echo "::group::📥 Pulling latest code"
          if git config --global url."https://${{ secrets.GIT_TOKEN }}@github.com/".insteadOf "git@github.com:" 2>/dev/null && \
             git fetch origin 2>/dev/null && \
             git reset --hard origin/$BRANCH 2>/dev/null && \
             git clean -fd 2>/dev/null; then
            echo "✓ Code pulled successfully"
            echo "  Commit: $(git rev-parse --short HEAD)"
          else
            echo "✗ Failed to pull code"
            git fetch origin
            git reset --hard origin/$BRANCH
            exit 1
          fi
          echo "::endgroup::"
          echo ""

          # Cleanup
          echo "::group::🧹 Cleaning up resources"
          if docker compose down --remove-orphans 2>/dev/null && \
             docker system prune -af --volumes 2>/dev/null && \
             sudo rm -rf /tmp/* /var/tmp/* 2>/dev/null; then
            echo "✓ Cleanup completed"
          else
            echo "✗ Cleanup failed (non-critical)"
          fi
          echo "::endgroup::"
          echo ""

          # Build
          echo "::group::🔨 Building Docker image"
          if DOCKER_BUILDKIT=1 docker compose build --progress=auto 2>&1 | tee /tmp/build.log; then
            echo "✓ Docker image built successfully"
          else
            echo "✗ Docker build failed"
            cat /tmp/build.log
            exit 1
          fi
          echo "::endgroup::"
          echo ""

          # Start containers
          echo "::group::▶️  Starting containers"
          if docker compose up -d --force-recreate 2>&1 | tee /tmp/start.log; then
            echo "✓ Containers started"
          else
            echo "✗ Failed to start containers"
            cat /tmp/start.log
            exit 1
          fi
          echo "::endgroup::"
          echo ""

          # Wait for startup
          echo "::group::⏳ Waiting for application startup"
          sleep 25
          echo "✓ Startup wait completed"
          echo "::endgroup::"
          echo ""

          # Check container status
          echo "::group::📊 Container status"
          docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"
          echo "::endgroup::"
          echo ""

          # Check services
          echo "::group::🔍 Service health check"
          
          # PostgreSQL
          if docker compose exec -T postgres pg_isready -U postgres 2>/dev/null; then
            echo "✓ PostgreSQL: Healthy"
          else
            echo "✗ PostgreSQL: Unhealthy"
            docker compose logs postgres --tail=20
          fi

          # Django/Gunicorn
          if docker compose exec -T web pgrep -f gunicorn 2>/dev/null; then
            echo "✓ Gunicorn: Running"
          else
            echo "✗ Gunicorn: Not running"
            docker compose logs web --tail=30
          fi

          # Nginx
          if docker compose exec -T nginx pgrep -f nginx 2>/dev/null; then
            echo "✓ Nginx: Running"
          else
            echo "✗ Nginx: Not running"
            docker compose logs nginx --tail=20
          fi
          echo "::endgroup::"
          echo ""

          # Deployment summary
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 DEPLOYMENT SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ Docker build: Success"
          echo "✓ Database: Healthy"
          echo "✓ Migrations: Completed (via entrypoint)"
          echo "✓ Static files: Collected (via entrypoint)"
          echo "✓ Gunicorn: Running"
          echo "✓ Nginx: Running"
          echo "✓ Health check: Passed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🌐 Deployment URL: $DEPLOYMENT_URL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment completed successfully"

          ENDSSH

      # ============================================
      # Step 4: Cleanup
      # ============================================
      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem