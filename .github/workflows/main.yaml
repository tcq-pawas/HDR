name: Deploy to EC2

on:
  push:
    branches:
      - Production
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Django App to EC2
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # Step 1: Checkout Repository
      # ============================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # Step 2: Configure SSH
      # ============================================
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ============================================
      # Step 3: Deploy to EC2
      # ============================================
      - name: Deploy Application
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'

          set -e

          PROJECT_DIR="/home/ubuntu/HDR"
          BRANCH="Production"

          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y docker.io >/dev/null
            sudo systemctl enable docker >/dev/null && sudo systemctl start docker >/dev/null
            sudo usermod -aG docker $USER
          fi

          if ! docker compose version >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y docker-compose-plugin >/dev/null
          fi

          cd "$PROJECT_DIR"

          sudo chown -R $USER:$USER "$PROJECT_DIR" >/dev/null 2>&1
          sudo chmod -R 755 "$PROJECT_DIR" >/dev/null 2>&1

          git config --global url."https://${{ secrets.GIT_TOKEN }}@github.com/".insteadOf "git@github.com:"

          git fetch origin >/dev/null 2>&1
          git reset --hard HEAD >/dev/null 2>&1
          git clean -fd >/dev/null 2>&1
          git checkout $BRANCH >/dev/null 2>&1
          git reset --hard origin/$BRANCH >/dev/null 2>&1
          git clean -fd >/dev/null 2>&1

          docker compose down --remove-orphans >/dev/null 2>&1 || true
          docker system prune -af --volumes >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          docker volume prune -af >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          sudo apt-get autoclean -y >/dev/null 2>&1 || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* >/dev/null 2>&1 || true
          sudo journalctl --vacuum-time=3d >/dev/null 2>&1 || true
          sudo rm -rf /var/log/*.gz /tmp/* /var/tmp/* >/dev/null 2>&1 || true

          DOCKER_BUILDKIT=1 docker compose build --progress=auto
          docker compose up -d --force-recreate >/dev/null 2>&1

          sleep 15
          docker compose ps

          ENDSSH

      # ============================================
      # Step 4: Cleanup
      # ============================================
      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem