name: Deploy to EC2

on:
  push:
    branches:
      - Production
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Django App to EC2
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # Step 1: Checkout Repository
      # ============================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # Step 2: Configure SSH
      # ============================================
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ============================================
      # Step 3: Deploy to EC2
      # ============================================
      - name: Deploy Application
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'

          set -e

          PROJECT_DIR="/home/ubuntu/HDR"
          BRANCH="Production"

          echo "🚀 Starting deployment..."

          # Install Docker if missing
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y docker.io >/dev/null
            sudo systemctl enable docker >/dev/null
            sudo systemctl start docker >/dev/null
            sudo usermod -aG docker $USER
          fi

          # Install Docker Compose Plugin
          if ! docker compose version >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y docker-compose-plugin >/dev/null
          fi

          cd "$PROJECT_DIR"

          if [ ! -f docker-compose.yml ]; then
            echo "❌ docker-compose.yml not found!"
            exit 1
          fi

          sudo chown -R $USER:$USER "$PROJECT_DIR" >/dev/null
          sudo chmod -R 755 "$PROJECT_DIR" >/dev/null

          git config --global url."https://${{ secrets.GIT_TOKEN }}@github.com/".insteadOf "git@github.com:"

          echo "📥 Pulling latest code..."
          git fetch origin >/dev/null
          git reset --hard HEAD >/dev/null
          git clean -fd >/dev/null
          git checkout $BRANCH >/dev/null
          git reset --hard origin/$BRANCH >/dev/null
          git clean -fd >/dev/null

          echo "📦 Current commit: $(git rev-parse --short HEAD)"

          echo "🛑 Stopping containers..."
          docker compose down --remove-orphans >/dev/null 2>&1 || true

          echo "🧹 Cleaning up resources..."
          docker system prune -af --volumes >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          docker volume prune -af >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          sudo apt-get autoclean -y >/dev/null 2>&1 || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* >/dev/null 2>&1 || true
          sudo journalctl --vacuum-time=3d >/dev/null 2>&1 || true
          sudo rm -rf /var/log/*.gz /tmp/* /var/tmp/* >/dev/null 2>&1 || true

          echo "🔨 Building Docker image..."
          DOCKER_BUILDKIT=1 docker compose build --progress=auto

          echo "▶️  Starting containers..."
          docker compose up -d --force-recreate >/dev/null

          sleep 10

          echo "📊 Container status:"
          docker compose ps

          echo "📋 Recent container logs:"
          docker compose logs --tail=50 web

          echo "✅ Deployment completed successfully"

          ENDSSH

      # ============================================
      # Step 4: Cleanup
      # ============================================
      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem