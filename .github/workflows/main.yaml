name: Deploy to EC2

on:
  push:
    branches:
      - Production
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Django App to EC2
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # Step 1: Checkout Repository
      # ============================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # Step 2: Configure SSH
      # ============================================
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ============================================
      # Step 3: Deploy to EC2
      # ============================================
      - name: Deploy Application
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'

          set -e

          PROJECT_DIR="/home/ubuntu/HDR"
          BRANCH="Production"

          spinner() {
            local pid=$1
            local msg=$2
            local delay=0.1
            local spinstr='|/-\'
            while [ "$(ps a | awk '{print $1}' | grep $pid)" ]; do
              local temp=${spinstr#?}
              printf " [$temp] $msg  \r" 
              local spinstr=$temp${spinstr%"$temp"}
              sleep $delay
            done
            printf " \r"
          }

          cd "$PROJECT_DIR"

          echo "→ Pulling code..."
          git config --global url."https://${{ secrets.GIT_TOKEN }}@github.com/".insteadOf "git@github.com:" >/dev/null 2>&1
          git fetch origin >/dev/null 2>&1
          git reset --hard origin/$BRANCH >/dev/null 2>&1
          git clean -fd >/dev/null 2>&1

          echo "→ Cleaning up..."
          docker compose down --remove-orphans >/dev/null 2>&1 || true
          docker system prune -af --volumes >/dev/null 2>&1 || true
          sudo rm -rf /tmp/* /var/tmp/* >/dev/null 2>&1 || true

          echo "→ Building image..."
          DOCKER_BUILDKIT=1 docker compose build --progress=auto

          echo "→ Starting containers..."
          docker compose up -d --force-recreate >/dev/null 2>&1

          echo "→ Waiting for startup..."
          sleep 20

          echo "→ Status:"
          docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"

          ENDSSH

      # ============================================
      # Step 4: Cleanup
      # ============================================
      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem