name: Deploy to EC2

on:
  push:
    branches:
      - Production
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Django App to EC2
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # Step 1: Checkout Repository
      # ============================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # Step 2: Configure SSH
      # ============================================
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ============================================
      # Step 3: Deploy to EC2
      # ============================================
      - name: Deploy Application
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'

          set -e

          PROJECT_DIR="/home/ubuntu/HDR"
          BRANCH="Production"

          echo "======================================"
          echo "Starting Deployment"
          echo "======================================"

          # Install Docker if missing
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker.io
            sudo systemctl enable docker
            sudo systemctl start docker
            sudo usermod -aG docker $USER
          fi

          # Install Docker Compose Plugin
          if ! docker compose version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker-compose-plugin
          fi

          # Go to project
          cd "$PROJECT_DIR"

          if [ ! -f docker-compose.yml ]; then
            echo "docker-compose.yml not found!"
            exit 1
          fi

          echo "Current Directory:"
          pwd

          echo "Fixing git repository permissions..."
          sudo chown -R $USER:$USER "$PROJECT_DIR"
          sudo chmod -R 755 "$PROJECT_DIR"

          echo "Configuring git to use HTTPS with token..."
          git config --global url."https://${{ secrets.GIT_TOKEN }}@github.com/".insteadOf "git@github.com:"

          echo "Fetching latest code..."
          git fetch origin

          echo "Discarding local changes..."
          git reset --hard HEAD
          git clean -fd

          echo "Checkout branch..."
          git checkout $BRANCH

          echo "Resetting repository..."
          git reset --hard origin/$BRANCH

          echo "Cleaning repository..."
          git clean -fd

          echo "======================================"
          echo "Git Status"
          echo "======================================"
          git status

          echo "======================================"
          echo "Current Commit"
          echo "======================================"
          git rev-parse HEAD

          echo "======================================"
          echo "Recent Commits"
          echo "======================================"
          git log --oneline -5

          echo "======================================"
          echo "Stopping Containers"
          echo "======================================"
          docker compose down --remove-orphans || true

          echo "======================================"
          echo "Disk Space Before Cleanup"
          echo "======================================"
          df -h

          echo "======================================"
          echo "Cleaning Docker Resources"
          echo "======================================"
          docker system prune -af --volumes || true
          docker builder prune -af || true
          docker volume prune -af || true

          echo "======================================"
          echo "Removing Unused System Packages"
          echo "======================================"
          sudo apt-get autoremove -y || true
          sudo apt-get autoclean -y || true

          echo "======================================"
          echo "Cleaning Package Cache"
          echo "======================================"
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo rm -rf /var/cache/apt/archives/* || true

          echo "======================================"
          echo "Removing Unused Logs"
          echo "======================================"
          sudo journalctl --vacuum-time=3d || true
          sudo rm -rf /var/log/*.gz || true

          echo "======================================"
          echo "Cleaning Temporary Files"
          echo "======================================"
          sudo rm -rf /tmp/* || true
          sudo rm -rf /var/tmp/* || true

          echo "======================================"
          echo "Disk Space After Cleanup"
          echo "======================================"
          df -h

          echo "======================================"
          echo "Building New Image"
          echo "======================================"
          DOCKER_BUILDKIT=1 docker compose build --progress=plain

          echo "======================================"
          echo "Starting Containers"
          echo "======================================"
          docker compose up -d --force-recreate

          sleep 10

          echo "======================================"
          echo "Running Containers"
          echo "======================================"
          docker compose ps

          echo "======================================"
          echo "Container Logs"
          echo "======================================"
          docker compose logs --tail=100

          echo "======================================"
          echo "Deployment Completed Successfully"
          echo "======================================"

          ENDSSH

      # ============================================
      # Step 4: Cleanup
      # ============================================
      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem