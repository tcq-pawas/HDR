name: Deploy to EC2

on:
  push:
    branches:
      - HDR-New
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy Django App to EC2
    runs-on: ubuntu-latest
    
    steps:
      # ============================================
      # Step 1: Checkout the code from GitHub
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4
      
      # ============================================
      # Step 2: Set up Python environment
      # ============================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # ============================================
      # Step 3: Install dependencies
      # ============================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # ============================================
      # Step 4: Run basic checks/tests
      # ============================================
      - name: Run Django checks
        run: |
          python manage.py check --deploy
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_ENGINE: django.db.backends.sqlite3
          DEBUG: False
      
      # ============================================
      # Step 5: Configure SSH key for EC2 access
      # ============================================
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      
      # ============================================
      # Step 6: Deploy to EC2 server
      # ============================================
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            # Set project directory
            PROJECT_DIR="/home/ubuntu/HeyDay"
            
            # Create project directory if it doesn't exist
            sudo mkdir -p $PROJECT_DIR
            sudo chown $USER:$USER $PROJECT_DIR
            
            # Clone repository if it doesn't exist, otherwise pull latest
            if [ ! -d "$PROJECT_DIR/HDR/.git" ]; then
              cd $PROJECT_DIR
              git clone ${{ secrets.GITHUB_REPO_URL }} HDR
              cd HDR
              git checkout main
            else
              cd $PROJECT_DIR/HDR
              git fetch origin main
              git checkout main
              git pull origin main
            fi
            
            # Create virtual environment if it doesn't exist
            if [ ! -d "$PROJECT_DIR/myenv" ]; then
              cd $PROJECT_DIR
              python3 -m venv myenv
            fi
            
            # Activate virtual environment
            source $PROJECT_DIR/myenv/bin/activate
            
            # Install/update dependencies
            pip install -r requirements.txt --quiet
            
            # Run Django migrations
            python3 manage.py migrate --noinput
            
            # Collect static files
            python3 manage.py collectstatic --noinput --clear
            
            # Restart Gunicorn service if it exists
            if systemctl is-active --quiet gunicorn; then
              sudo systemctl restart gunicorn
            elif service gunicorn status > /dev/null 2>&1; then
              sudo service gunicorn restart
            else
              echo "Gunicorn service not found, skipping restart"
            fi
            
            # Reload Nginx if it's active
            if systemctl is-active --quiet nginx; then
              sudo systemctl reload nginx
            elif service nginx status > /dev/null 2>&1; then
              sudo service nginx reload
            else
              echo "Nginx service not active, skipping reload"
            fi
          ENDSSH
      
      # ============================================
      # Step 7: Cleanup SSH key
      # ============================================
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key.pem
